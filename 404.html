<!DOCTYPE html>
<html lang="en" dir="ltr" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniTutor - 404 Page Not Found</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            theme: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            },
            amberGold: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-[#061512] dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-300 relative">

  <!-- Top Right Sticky Utility Controls (Dark Mode & RTL) -->
  <div class="fixed top-5 right-5 sm:top-6 sm:right-6 flex items-center gap-2 z-[9999]">
    <button class="action-btn" id="btn-rtl-toggle" onclick="toggleRTL()" aria-label="Toggle LTR/RTL Layout" title="Switch layout direction">
      <span style="font-size: 11px; font-weight: 700; letter-spacing: -0.5px;">⇄ RTL</span>
    </button>
    <button id="dark-mode-btn" onclick="toggleDarkMode()" type="button" title="Toggle Light / Dark Mode" class="p-2 bg-white dark:bg-[#163830] rounded-xl text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-[#1a3d35] shadow-sm hover:bg-slate-50 dark:hover:bg-[#1d4a40] transition">
      <span class="dark:hidden">🌙</span><span class="hidden dark:inline">☀️</span>
    </button>
  </div>

  <!-- MAIN 404 CONTAINER (STANDALONE NO NAVBAR/FOOTER) -->
  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white dark:bg-[#0d231e] rounded-3xl shadow-2xl border border-emerald-100 dark:border-[#1a3d35] p-8 sm:p-10 space-y-6 text-center">
        
        <!-- Brand Logo -->
        <div class="flex flex-col items-center">
          <a href="index.html" class="inline-flex items-center gap-2.5 group">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-theme-600 via-theme-500 to-amberGold-500 flex items-center justify-center text-white shadow-md shadow-theme-600/30 group-hover:scale-105 transition-transform logo-glow">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l9-5-9-5-9 5 9 5z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
              </svg>
            </div>
            <div class="text-left">
              <span class="text-xl font-black tracking-tight text-slate-900 dark:text-white">UniTutor<span class="text-amberGold-500">.</span></span>
              <span class="block text-[9px] font-extrabold text-theme-600 dark:text-theme-400 tracking-wider uppercase leading-none">University Online</span>
            </div>
          </a>
        </div>

        <!-- 404 Large Graphic Badge -->
        <div class="py-4 space-y-2">
          <div class="inline-block relative">
            <span class="text-7xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-theme-600 via-emerald-500 to-amberGold-500">
              404
            </span>
          </div>
          <h1 class="text-2xl font-black text-slate-900 dark:text-white">Page Not Found</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 font-medium leading-relaxed max-w-xs mx-auto">
            Oops! The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
          </p>
        </div>

        <!-- Action Buttons -->
        <div class="space-y-3 pt-2">
          <a href="index.html" class="block w-full py-3.5 rounded-xl bg-theme-600 hover:bg-theme-700 text-white font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-theme-600/30 transition hover:scale-[1.02]">
            ← Back to Homepage
          </a>

          <div class="grid grid-cols-2 gap-3">
            <a href="tutors.html" class="py-2.5 px-3 rounded-xl border border-emerald-200 dark:border-[#1a3d35] bg-slate-50 dark:bg-[#061512] hover:bg-emerald-50 dark:hover:bg-[#163830] transition text-xs font-bold text-slate-700 dark:text-slate-200">
              Find a Tutor
            </a>
            <a href="subjects.html" class="py-2.5 px-3 rounded-xl border border-emerald-200 dark:border-[#1a3d35] bg-slate-50 dark:bg-[#061512] hover:bg-emerald-50 dark:hover:bg-[#163830] transition text-xs font-bold text-slate-700 dark:text-slate-200">
              Browse Subjects
            </a>
          </div>
        </div>

        <!-- Quick Help Note -->
        <div class="text-center text-xs text-slate-500 dark:text-slate-400 pt-2 border-t border-emerald-100 dark:border-[#1a3d35]">
          Need assistance? 
          <a href="#" onclick="if(window.showToast) window.showToast('Support agent notified! We will contact you shortly.', 'info'); return false;" class="text-theme-600 dark:text-theme-400 font-bold hover:underline">Contact Support</a>
        </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
