<!DOCTYPE html>
<html lang="en" dir="ltr" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniTutor - Create Account</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            theme: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            },
            amberGold: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-[#061512] dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-300 relative">

  <!-- Top Right Sticky Utility Controls (Dark Mode & RTL) -->
  <div class="fixed top-5 right-5 sm:top-6 sm:right-6 flex items-center gap-2 z-[9999]">
    <button id="btn-rtl-toggle" onclick="toggleRTL()" type="button" aria-label="Toggle LTR/RTL Layout" title="Switch layout direction" class="p-2 bg-white dark:bg-[#163830] rounded-xl text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-[#1a3d35] shadow-sm hover:bg-slate-50 dark:hover:bg-[#1d4a40] transition">
      <svg class="w-4 h-4 text-theme-600 dark:text-theme-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
      </svg>
    </button>
    <button id="dark-mode-btn" onclick="toggleDarkMode()" type="button" title="Toggle Light / Dark Mode" class="p-2 bg-white dark:bg-[#163830] rounded-xl text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-[#1a3d35] shadow-sm hover:bg-slate-50 dark:hover:bg-[#1d4a40] transition">
      <svg class="w-4 h-4 hidden dark:block text-amberGold-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      <svg class="w-4 h-4 block dark:hidden text-theme-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
    </button>
  </div>

  <!-- MAIN REGISTRATION CONTAINER -->
  <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white dark:bg-[#0d231e] rounded-3xl shadow-2xl border border-emerald-100 dark:border-[#1a3d35] p-8 sm:p-10 space-y-6">
        
        <div class="text-center flex flex-col items-center">
          <a href="index.html" class="inline-flex items-center gap-2.5 group">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-theme-600 via-theme-500 to-amberGold-500 flex items-center justify-center text-white shadow-md shadow-theme-600/30 group-hover:scale-105 transition-transform logo-glow">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l9-5-9-5-9 5 9 5z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0112 20.055a11.952 11.952 0 01-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/>
              </svg>
            </div>
            <div class="text-left">
              <span class="text-xl font-black tracking-tight text-slate-900 dark:text-white">UniTutor<span class="text-amberGold-500">.</span></span>
              <span class="block text-[9px] font-extrabold text-theme-600 dark:text-theme-400 tracking-wider uppercase leading-none">University Online</span>
            </div>
          </a>
        </div>

        <!-- Role Quick Switcher Pills -->
        <div class="p-1 bg-slate-100 dark:bg-[#061512] rounded-2xl flex text-xs font-extrabold">
          <button onclick="selectRegisterPageRole('Student')" id="page-role-student" class="flex-1 py-2.5 rounded-xl bg-white dark:bg-theme-600 text-theme-600 dark:text-white shadow-sm transition">
            🎓 Student
          </button>
          <button onclick="selectRegisterPageRole('Tutor')" id="page-role-tutor" class="flex-1 py-2.5 rounded-xl text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition">
            👨‍🏫 Tutor
          </button>
          <button onclick="selectRegisterPageRole('Admin')" id="page-role-admin" class="flex-1 py-2.5 rounded-xl text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 transition">
            🛡️ Admin
          </button>
        </div>

        <!-- Form -->
        <form onsubmit="handleRegisterPageSubmit(event)" class="space-y-4 text-left">
          
          <div>
            <label class="block text-xs font-black uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">
              Full Name
            </label>
            <input type="text" id="register-page-name" placeholder="e.g. John Doe" required class="w-full px-4 py-3 rounded-xl border border-emerald-200 dark:border-[#1a3d35] bg-slate-50 dark:bg-[#061512] text-xs font-semibold text-slate-900 dark:text-white focus:ring-2 focus:ring-theme-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-black uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">
              Email Address
            </label>
            <input type="email" id="register-page-email" placeholder="name@university.edu" required class="w-full px-4 py-3 rounded-xl border border-emerald-200 dark:border-[#1a3d35] bg-slate-50 dark:bg-[#061512] text-xs font-semibold text-slate-900 dark:text-white focus:ring-2 focus:ring-theme-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-black uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">
              Password
            </label>
            <input type="password" id="register-page-password" placeholder="••••••••••••" required class="w-full px-4 py-3 rounded-xl border border-emerald-200 dark:border-[#1a3d35] bg-slate-50 dark:bg-[#061512] text-xs font-semibold text-slate-900 dark:text-white focus:ring-2 focus:ring-theme-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-black uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1">
              Confirm Password
            </label>
            <input type="password" id="register-page-confirm-password" placeholder="••••••••••••" required class="w-full px-4 py-3 rounded-xl border border-emerald-200 dark:border-[#1a3d35] bg-slate-50 dark:bg-[#061512] text-xs font-semibold text-slate-900 dark:text-white focus:ring-2 focus:ring-theme-500 focus:outline-none">
          </div>

          <div class="flex items-center text-xs text-slate-500 dark:text-slate-400">
            <label class="flex items-center gap-2 cursor-pointer font-medium">
              <input type="checkbox" required class="rounded text-theme-600 focus:ring-theme-500">
              <span>I agree to the <a href="#" class="text-theme-600 dark:text-theme-400 font-bold hover:underline">Terms of Service</a> & <a href="#" class="text-theme-600 dark:text-theme-400 font-bold hover:underline">Privacy Policy</a></span>
            </label>
          </div>

          <button type="submit" class="w-full py-3.5 rounded-xl bg-theme-600 hover:bg-theme-700 text-white font-extrabold text-xs uppercase tracking-wider shadow-lg shadow-theme-600/30 transition hover:scale-[1.02]">
            Create Account →
          </button>
        </form>

        <!-- Social SSO Divider -->
        <div class="relative flex items-center justify-center my-4">
          <div class="border-t border-emerald-100 dark:border-[#1a3d35] w-full"></div>
          <span class="bg-white dark:bg-[#0d231e] px-3 text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider shrink-0">
            or register with
          </span>
          <div class="border-t border-emerald-100 dark:border-[#1a3d35] w-full"></div>
        </div>

        <!-- 3 Social Login Buttons / Icons -->
        <div class="grid grid-cols-3 gap-2.5">
          <!-- Google -->
          <button type="button" onclick="if(window.showToast) window.showToast('Registering with Google SSO...', 'info')" class="flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl border border-slate-200 dark:border-[#1a3d35] bg-slate-50 dark:bg-[#061512] hover:bg-slate-100 dark:hover:bg-[#163830] transition text-xs font-bold text-slate-700 dark:text-slate-200">
            <svg class="w-4 h-4" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Google</span>
          </button>

          <!-- Apple -->
          <button type="button" onclick="if(window.showToast) window.showToast('Registering with Apple ID...', 'info')" class="flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl border border-slate-200 dark:border-[#1a3d35] bg-slate-50 dark:bg-[#061512] hover:bg-slate-100 dark:hover:bg-[#163830] transition text-xs font-bold text-slate-700 dark:text-slate-200">
            <svg class="w-4 h-4 fill-current text-slate-900 dark:text-white" viewBox="0 0 24 24">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.82c.67-.82 1.13-1.96.99-3.12-1 .04-2.22.67-2.92 1.49-.62.72-1.16 1.88-1.01 3.01 1.12.09 2.27-.56 2.94-1.38z"/>
            </svg>
            <span>Apple</span>
          </button>

          <!-- Microsoft -->
          <button type="button" onclick="if(window.showToast) window.showToast('Registering with Microsoft SSO...', 'info')" class="flex items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl border border-slate-200 dark:border-[#1a3d35] bg-slate-50 dark:bg-[#061512] hover:bg-slate-100 dark:hover:bg-[#163830] transition text-xs font-bold text-slate-700 dark:text-slate-200">
            <svg class="w-4 h-4" viewBox="0 0 23 23">
              <path fill="#f35325" d="M1 1h10v10H1z"/>
              <path fill="#81bc06" d="M12 1h10v10H12z"/>
              <path fill="#05a6f0" d="M1 12h10v10H1z"/>
              <path fill="#ffba08" d="M12 12h10v10H12z"/>
            </svg>
            <span>Microsoft</span>
          </button>
        </div>

        <div class="text-center text-xs text-slate-500 dark:text-slate-400 pt-2 border-t border-emerald-100 dark:border-[#1a3d35]">
          Already have an account? 
          <a href="login.html" class="text-theme-600 dark:text-theme-400 font-bold hover:underline">Sign In</a>
        </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="js/mock-data.js"></script>
  <script src="js/app.js"></script>

  <script>
    let selectedRole = "Student";

    function selectRegisterPageRole(role) {
      selectedRole = role;
      const bStudent = document.getElementById('page-role-student');
      const bTutor = document.getElementById('page-role-tutor');
      const bAdmin = document.getElementById('page-role-admin');

      const activeClasses = ['bg-white', 'dark:bg-theme-600', 'text-theme-600', 'dark:text-white', 'shadow-sm'];
      const inactiveClasses = ['text-slate-500', 'hover:text-slate-700', 'dark:hover:text-slate-300'];

      [bStudent, bTutor, bAdmin].forEach(b => {
        if (b) {
          b.classList.remove(...activeClasses);
          b.classList.add(...inactiveClasses);
        }
      });

      if (role === 'Student' && bStudent) {
        bStudent.classList.add(...activeClasses);
        bStudent.classList.remove(...inactiveClasses);
      } else if (role === 'Tutor' && bTutor) {
        bTutor.classList.add(...activeClasses);
        bTutor.classList.remove(...inactiveClasses);
      } else if (role === 'Admin' && bAdmin) {
        bAdmin.classList.add(...activeClasses);
        bAdmin.classList.remove(...inactiveClasses);
      }
    }

    function handleRegisterPageSubmit(e) {
      e.preventDefault();
      const nameInput = document.getElementById('register-page-name');
      const emailInput = document.getElementById('register-page-email');
      const passInput = document.getElementById('register-page-password');
      const confirmPassInput = document.getElementById('register-page-confirm-password');

      const name = nameInput ? nameInput.value.trim() : '';
      const email = emailInput ? emailInput.value.trim() : '';
      const pass = passInput ? passInput.value : '';
      const confirmPass = confirmPassInput ? confirmPassInput.value : '';

      if (pass !== confirmPass) {
        if (window.showToast) window.showToast('Passwords do not match.', 'error');
        return;
      }

      localStorage.setItem('unitutor_user', JSON.stringify({ name, email, role: selectedRole }));

      if (window.showToast) window.showToast(`Account created successfully as ${selectedRole}!`, 'success');

      setTimeout(() => {
        if (selectedRole === 'Admin') {
          window.location.href = "admin-dashboard.html";
        } else {
          window.location.href = "user-dashboard.html";
        }
      }, 600);
    }
  </script>
</body>
</html>
